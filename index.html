<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday KURBAAN 🎂</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Dancing+Script:wght@700&family=Great+Vibes&display=swap');
body{font-family:'Poppins',sans-serif;min-height:100vh;background:radial-gradient(circle at top,#1e1e2f 0%,#0f0c29 40%,#302b63 100%);display:flex;align-items:center;justify-content:center;padding:20px;}
.glow{position:fixed;width:400px;height:400px;border-radius:50%;filter:blur(90px);opacity:0.4;z-index:0;}
.g1{background:#ff4ecd;top:-100px;left:-100px;} .g2{background:#6a5af9;bottom:-100px;right:-100px;}
.birthday-card{position:relative;z-index:2;background:rgba(255,255,255,0.08);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,0.15);border-radius:32px;max-width:520px;width:100%;box-shadow:0 25px 80px rgba(0,0,0,0.4);overflow:hidden;}
h1.main-title{font-family:'Dancing Script',cursive;font-size:50px;background:linear-gradient(90deg,#fff,#ffd1ff,#ffb86c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

/* CIRCLE PHOTO - PURA LADKA DIKHEGA */
.photo-circle-wrap{
  width:220px; height:220px; margin:0 auto;
  border-radius:50%; padding:6px;
  background:linear-gradient(135deg,#ff6ec7,#ff9a3c,#6a5af9);
  box-shadow:0 15px 50px rgba(255,110,199,0.5);
}
.photo-circle-wrap img{
  width:100%; height:100%;
  border-radius:50%;
  object-fit:cover; /* pura face cover karega */
  object-position:top center; /* upar se set kiya taki head cut na ho */
  background:#111; display:block;
}
.btn-premium{background:linear-gradient(90deg,#ff4ecd,#6a5af9);border:none;border-radius:50px;padding:12px 32px;font-weight:700;}
.voice-box{background:rgba(255,255,255,0.12);border-radius:16px;padding:14px 16px;border:1px dashed rgba(255,255,255,0.3);}
.certificate{background:linear-gradient(135deg,#fffaf0 0%,#ffe8cc 100%);border-radius:20px;border:3px double #ff8a5c;padding:20px;color:#333;}
.certificate h2{font-family:'Great Vibes',cursive;font-size:42px;color:#e91e63;}
.confetti{position:fixed;top:-10px;font-size:22px;animation:fall linear forwards;z-index:9999;pointer-events:none;}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0;}}
.hidden{display:none !important;}
.btn-whatsapp{background:#25D366;border:none;border-radius:50px;font-weight:700;}
</style>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div>

<div class="card birthday-card text-center p-0">
  <div style="background:linear-gradient(90deg,#ff7e5f,#feb47b,#ff6ec7);height:6px;"></div>
  
  <div class="p-4 p-md-5" id="birthdaySection">
    <span class="badge rounded-pill bg-warning text-dark mb-2"><i class="bi bi-stars"></i> Premium For KURBAAN</span>
    <h1 class="main-title mb-1">Happy Birthday KURBAAN!</h1>
    <p class="text-white-50 small mb-3">Aaj ka din sirf tumhara hai 🎉</p>

    <!-- CIRCLE PHOTO - AB PURA DIKHEGA -->
    <div class="photo-circle-wrap">
      <img id="mainPhoto" src="./1.jpeg" alt="KURBAAN" onerror="this.src='https://via.placeholder.com/300?text=KURBAAN'">
    </div>

    <!-- VOICE NOTE -->
    <div class="voice-box mt-4">
      <div class="d-flex align-items-center gap-3">
        <div class="bg-white text-danger rounded-circle d-flex align-items-center justify-content-center" style="width:52px;height:52px;font-size:24px;"><i class="bi bi-mic-fill"></i></div>
        <div class="text-start flex-grow-1">
          <p class="text-white mb-0 fw-bold">Happy Birthday KURBAAN 🎤</p>
          <div class="d-flex gap-1 mt-1">
            <span style="width:3px;height:14px;background:#ff6ec7;border-radius:10px;display:inline-block"></span>
            <span style="width:3px;height:20px;background:#ffb86c;border-radius:10px;display:inline-block"></span>
            <span style="width:3px;height:10px;background:#6a5af9;border-radius:10px;display:inline-block"></span>
            <span style="width:3px;height:18px;background:#ff6ec7;border-radius:10px;display:inline-block"></span>
            <span class="text-white-50 ms-2" style="font-size:11px;">Tap to play</span>
          </div>
        </div>
        <button class="btn btn-light rounded-circle" onclick="playVoice()" id="playBtn" style="width:46px;height:46px;"><i class="bi bi-play-fill fs-4"></i></button>
      </div>
    </div>

    <div class="d-grid gap-2 mt-4">
      <button class="btn btn-premium text-white" onclick="celebrate()"><i class="bi bi-balloon"></i> Celebration 🎂</button>
      <button class="btn btn-outline-light rounded-pill" onclick="showCertificate()"><i class="bi bi-award"></i> Certificate 📜</button>
      <button class="btn btn-whatsapp text-white" onclick="shareWA()"><i class="bi bi-whatsapp"></i> WhatsApp pe Bhejo 💌</button>
    </div>
  </div>

  <!-- CERTIFICATE -->
  <div class="p-4 p-md-5 hidden" id="certificateSection">
    <div class="certificate text-center">
      <p class="mb-1 small text-muted">OFFICIAL BIRTHDAY CERTIFICATE</p>
      <h2>Happy Birthday</h2>
      <div class="my-3" style="width:120px;height:120px;margin:0 auto;border-radius:50%;overflow:hidden;border:3px solid #ff8fab;padding:4px;background:linear-gradient(135deg,#ff6ec7,#ff9a3c);">
        <img id="certPhoto" src="./1.jpeg" style="width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:top center;" onerror="this.src='https://via.placeholder.com/120?text=KURBAAN'">
      </div>
      <h4 class="fw-bolder my-2" style="color:#e91e63;font-family:'Dancing Script',cursive;font-size:38px;">KURBAAN</h4>
      <p class="small text-muted">Wishing you a year full of happiness & success!</p>
      <div class="d-flex justify-content-between mt-4 pt-3" style="border-top:1px dashed #ffb88c;">
        <div class="text-start"><small>Date</small><br><b class="small">26 Oct 2026</b></div>
        <div class="text-end"><small style="font-family:'Great Vibes',cursive;font-size:20px;">Your Best Friend</small><br><small>With Love ❤️</small></div>
      </div>
    </div>
    <div class="d-grid gap-2 mt-3">
      <button class="btn btn-whatsapp text-white" onclick="shareWA()"><i class="bi bi-whatsapp"></i> Certificate Bhejo</button>
      <button class="btn btn-outline-light rounded-pill btn-sm" onclick="backToHome()">Back</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function playVoice(){
  speechSynthesis.cancel();
  const msg = new SpeechSynthesisUtterance("Happy Birthday Kurbaan! Happy Birthday to you! You are very special!");
  msg.lang = 'en-US'; msg.rate = 0.85; msg.pitch = 1;
  const btn = document.getElementById('playBtn');
  btn.innerHTML = '<i class="bi bi-pause-fill fs-4"></i>';
  msg.onend = () => { btn.innerHTML = '<i class="bi bi-play-fill fs-4"></i>'; };
  speechSynthesis.speak(msg);
}
function celebrate(){playVoice();for(let i=0;i<80;i++){setTimeout(()=>{const c=document.createElement('div');c.className='confetti';c.innerText=['🎉','🎂','🎈','💖','✨'][Math.floor(Math.random()*5)];c.style.left=Math.random()*100+'vw';c.style.animationDuration=(2+Math.random()*3)+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),4000);},i*40);}}
function showCertificate(){document.getElementById('birthdaySection').classList.add('hidden');document.getElementById('certificateSection').classList.remove('hidden');celebrate();}
function backToHome(){document.getElementById('certificateSection').classList.add('hidden');document.getElementById('birthdaySection').classList.remove('hidden');}
function shareWA(){window.open("https://wa.me/?text="+encodeURIComponent("Happy Birthday KURBAAN! 🎂❤️\nTere liye special website banayi hai - circle photo + voice + certificate ke saath! ✨"),"_blank");}
window.onload=()=>{setTimeout(playVoice,1200);}
</script>
</body>
</html>
